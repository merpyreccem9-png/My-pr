<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Luna</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="avatar">🌙</div>
      <div class="who">
        <div class="name">Luna</div>
        <div id="status" class="status">в сети</div>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Меню">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </header>

    <nav id="effort" class="seg" aria-label="Глубина мышления">
      <button data-depth="fast">⚡ Быстро</button>
      <button data-depth="normal">⚖️ Обычно</button>
      <button data-depth="deep">🧠 Глубоко</button>
      <button data-depth="auto">🤖 Авто</button>
    </nav>

    <main id="chat" class="chat"><div id="list" class="list"></div></main>

    <footer class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Сообщение Луне…" enterkeyhint="send"></textarea>
        <button id="send" class="send" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
